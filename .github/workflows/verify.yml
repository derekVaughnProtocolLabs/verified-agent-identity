steps:
  - name: Checkout repo
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '24'

  - name: Step 1 - Install ClawHub skill
    run: npx clawhub@latest install verified-agent-identity

  - name: Install script dependencies
    working-directory: scripts
    run: npm ci

  - name: Step 2 - Create new Ethereum Identity
    env:
      PRIVATE_KEY: ${{ secrets.MY_PRIVATE_KEY }}
    run: node createNewEthereumIdentity.js --key "$PRIVATE_KEY"
    working-directory: scripts

  - name: Step 3 - Link Human to Agent
    working-directory: scripts
    run: node manualLinkHumanToAgent.js --challenge '{"name":"xavironel","description":"xavironel AI Agent"}'
